services:
  karaoke-api:
    build: .
    restart: unless-stopped
    ports:
      - "5000:8000"
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://harisakthi1994-spec.github.io}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      DEMUCS_MODEL: ${DEMUCS_MODEL:-htdemucs}
      OUTPUT_FORMAT: ${OUTPUT_FORMAT:-mp3}
      MP3_BITRATE: ${MP3_BITRATE:-192}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-150}
      DEMUCS_TIMEOUT_SECONDS: ${DEMUCS_TIMEOUT_SECONDS:-1800}
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-1}
      MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-5}
      RATE_LIMIT_PER_HOUR: ${RATE_LIMIT_PER_HOUR:-10}
      RESULTS_TTL_MINUTES: ${RESULTS_TTL_MINUTES:-120}
      CACHE_TTL_DAYS: ${CACHE_TTL_DAYS:-30}
      CACHE_MAX_GB: ${CACHE_MAX_GB:-5}
      # Keep the downloaded Demucs weights across rebuilds/restarts.
      TORCH_HOME: /app/cache/torch
    volumes:
      - ./results:/app/results
      - ./cache:/app/cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
