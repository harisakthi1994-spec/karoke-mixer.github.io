<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke Mixer</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #667eea;
    --accent2: #c05fa0;
    --text: #ffffff;
    --muted: #a0aec0;
    --border: rgba(102, 126, 234, 0.3);
    --green: #3ecf8e;
    --red: #e05252;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px;
  }
  h1 {
    text-align: center;
    font-size: 1.7rem;
    font-weight: 700;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 28px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    max-width: 680px;
    margin-left: auto;
    margin-right: auto;
  }
  .card h2 {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 14px;
  }
  #dropzone {
    border: 2px dashed var(--border);
    border-radius: 10px;
    padding: 32px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  #dropzone:hover, #dropzone.drag-over {
    border-color: var(--accent);
    background: #1f1f2e;
  }
  #dropzone .icon { font-size: 2.2rem; margin-bottom: 8px; }
  #dropzone p { color: var(--muted); font-size: 0.9rem; }
  #dropzone p span { color: var(--accent); text-decoration: underline; cursor: pointer; }
  #file-input { display: none; }
  #file-name { margin-top: 10px; font-size: 0.85rem; color: var(--green); display: none; }
  #waveform-wrap { position: relative; margin-top: 14px; }
  #waveform { width: 100%; height: 120px; border-radius: 8px; background: var(--surface2); display: none; }
  #waveform-time { position: absolute; top: 6px; right: 10px; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  #stem-progress-wrap { margin-top: 14px; display: none; }
  #stem-progress-label { font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
  #stem-progress-bar-outer { background: var(--surface2); border-radius: 999px; height: 8px; overflow: hidden; }
  #stem-progress-bar { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 999px; transition: width 0.3s; }
  #stem-progress-bar.error { background: var(--red); }
  #stem-status { font-size: 0.8rem; color: var(--muted); margin-top: 6px; min-height: 1.2em; }
  #stem-status.status-error { color: #ff9a9a; }
  #stem-status.status-success { color: var(--green); }
  .select-row { display: flex; gap: 10px; align-items: center; }
  .select-row label { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
  select { flex: 1; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; font-size: 0.88rem; outline: none; cursor: pointer; }
  select:focus { border-color: var(--accent); }
  button.icon-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 8px 12px; cursor: pointer; font-size: 1rem; transition: border-color 0.2s; }
  button.icon-btn:hover { border-color: var(--accent); }
  #bt-status { font-size: 0.78rem; color: var(--muted); margin-top: 6px; }
  #bt-status.connected { color: var(--green); }
  #mixer { display: none; }
  .stem-row { margin-bottom: 18px; }
  .stem-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .stem-label { font-weight: 600; font-size: 0.95rem; }
  .stem-label.vocals { color: var(--accent2); }
  .stem-label.instrumental { color: var(--accent); }
  .stem-controls { display: flex; align-items: center; gap: 12px; }
  input[type=range] { -webkit-appearance: none; flex: 1; height: 5px; border-radius: 999px; background: var(--surface2); outline: none; cursor: pointer; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent); cursor: pointer; }
  input[type=range].vocals-range::-webkit-slider-thumb { background: var(--accent2); }
  .vol-val { font-size: 0.8rem; color: var(--muted); width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
  .playback-row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  button.play-btn { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; border: none; border-radius: 999px; padding: 10px 28px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
  button.play-btn:hover { opacity: 0.85; }
  button.play-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .param-row { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 4px; }
  .param-item { flex: 1; min-width: 140px; }
  .param-item label { display: block; font-size: 0.8rem; color: var(--muted); margin-bottom: 4px; }
  .param-item .param-val { font-size: 0.78rem; color: var(--muted); }
  #lyrics-area { width: 100%; height: 130px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); padding: 12px; font-size: 0.9rem; resize: vertical; outline: none; font-family: inherit; }
  #lyrics-area:focus { border-color: var(--accent); }
  #lyrics-display { background: var(--surface2); border-radius: 8px; padding: 14px; min-height: 60px; font-size: 1.05rem; line-height: 1.7; display: none; }
  .divider { border: none; border-top: 1px solid var(--border); margin: 4px 0 14px; }
</style>
</head>
<body>
<h1>🎤 Karaoke Mixer</h1>

<div class="card">
  <h2>Audio Source</h2>
  <div id="dropzone">
    <div class="icon">🎵</div>
    <p>Drop audio file here or <span id="browse-link">browse</span></p>
    <p style="margin-top:4px;font-size:0.78rem;">MP3, WAV, OGG, FLAC supported</p>
  </div>
  <input type="file" id="file-input" accept="audio/*">
  <div id="file-name"></div>
  <div id="waveform-wrap">
    <canvas id="waveform"></canvas>
    <span id="waveform-time"></span>
  </div>
  <div id="stem-progress-wrap">
    <div id="stem-progress-label">
      <span>Preparing vocal/instrumental separation…</span>
      <span id="stem-pct">0%</span>
    </div>
    <div id="stem-progress-bar-outer"><div id="stem-progress-bar"></div></div>
    <div id="stem-status">Ready.</div>
  </div>
</div>

<div class="card">
  <h2>Audio Output Device</h2>
  <div class="select-row">
    <label for="output-device">Device</label>
    <select id="output-device"><option value="">Default</option></select>
    <button class="icon-btn" id="refresh-devices" title="Refresh devices">⟳</button>
  </div>
  <div id="bt-status"></div>
</div>

<div class="card" id="mixer">
  <h2>Stem Mixer</h2>
  <div class="stem-row">
    <div class="stem-header"><span class="stem-label vocals">🎙 Vocals</span></div>
    <div class="stem-controls"><input type="range" class="vocals-range" id="vocals-vol" min="0" max="100" value="100"><span class="vol-val" id="vocals-vol-val">100</span></div>
  </div>
  <div class="stem-row">
    <div class="stem-header"><span class="stem-label instrumental">🎸 Instrumental</span></div>
    <div class="stem-controls"><input type="range" id="inst-vol" min="0" max="100" value="100"><span class="vol-val" id="inst-vol-val">100</span></div>
  </div>
  <hr class="divider">
  <div class="param-row">
    <div class="param-item"><label>Pitch <span class="param-val" id="pitch-val">0 st</span></label><input type="range" id="pitch" min="-12" max="12" value="0" step="1"></div>
    <div class="param-item"><label>Tempo <span class="param-val" id="tempo-val">1.0×</span></label><input type="range" id="tempo" min="0.5" max="2.0" value="1.0" step="0.05"></div>
  </div>
  <hr class="divider">
  <div class="playback-row"><button class="play-btn" id="play-btn" disabled>▶ Play</button><button class="icon-btn" id="stop-btn" disabled>■ Stop</button></div>
</div>

<div class="card">
  <h2>Lyrics</h2>
  <textarea id="lyrics-area" placeholder="Paste or type lyrics here…"></textarea>
  <div id="lyrics-display"></div>
</div>

<script>
let audioCtx = null;
let analyser = null;
let animFrame = null;
let sourceAudioBuffer = null;
let vocalBuffer = null;
let instBuffer = null;
let vocalSource = null;
let instSource = null;
let vocalGain = null;
let instGain = null;
let isPlaying = false;
let startTime = 0;
let pauseOffset = 0;
let selectedOutputDeviceId = '';

const canvas = document.getElementById('waveform');
const ctx2d = canvas.getContext('2d');
const waveTime = document.getElementById('waveform-time');
const outputSelect = document.getElementById('output-device');
const btStatus = document.getElementById('bt-status');
const progressWrap = document.getElementById('stem-progress-wrap');
const progressBar = document.getElementById('stem-progress-bar');
const progressPct = document.getElementById('stem-pct');
const stemStatus = document.getElementById('stem-status');
const mixer = document.getElementById('mixer');
const playBtn = document.getElementById('play-btn');
const stopBtn = document.getElementById('stop-btn');

function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 2048;
    analyser.connect(audioCtx.destination);
  }
  return audioCtx;
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

function drawWaveform() {
  if (!analyser) return;
  cancelAnimationFrame(animFrame);
  const render = () => {
    animFrame = requestAnimationFrame(render);
    const W = canvas.width || 640;
    const H = canvas.height || 120;
    const bufLen = analyser.frequencyBinCount;
    const data = new Uint8Array(bufLen);
    analyser.getByteFrequencyData(data);
    ctx2d.clearRect(0, 0, W, H);
    const barW = W / bufLen * 2.5;
    for (let i = 0; i < bufLen; i++) {
      const barH = (data[i] / 255) * H;
      const t = i / bufLen;
      const r = Math.round(76 + (224 - 76) * t);
      const g = Math.round(110 + (82 - 110) * t);
      const b = Math.round(245 + (82 - 245) * t);
      ctx2d.fillStyle = `rgb(${r},${g},${b})`;
      ctx2d.fillRect(i * barW, H - barH, Math.max(1, barW - 1), barH);
    }
    if (isPlaying && audioCtx) waveTime.textContent = formatTime(audioCtx.currentTime - startTime + pauseOffset);
  };
  render();
}

function resizeCanvas() {
  const wrap = canvas.parentElement;
  canvas.width = wrap.clientWidth || 640;
  canvas.height = 120;
}

async function refreshDevices() {
  try {
    if (navigator.mediaDevices?.getUserMedia) await navigator.mediaDevices.getUserMedia({ audio: true }).catch(() => {});
    const devices = await navigator.mediaDevices.enumerateDevices();
    const outputs = devices.filter(d => d.kind === 'audiooutput');
    outputSelect.innerHTML = '<option value="">Default</option>';
    let btFound = false;
    outputs.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.deviceId;
      const isBt = /bluetooth|bt|wireless|airpods|buds|headset/i.test(d.label);
      opt.textContent = (isBt ? '📶 ' : '🔊 ') + (d.label || `Output ${d.deviceId.slice(0, 6)}`);
      if (isBt) btFound = true;
      outputSelect.appendChild(opt);
    });
    outputSelect.value = selectedOutputDeviceId;
    btStatus.textContent = btFound ? 'Bluetooth device detected. Select it above.' : (outputs.length > 1 ? `${outputs.length} output(s) found.` : 'No additional output devices found.');
    btStatus.className = btFound ? 'connected' : '';
  } catch (e) {
    btStatus.textContent = 'Device enumeration not supported in this browser.';
  }
}

document.getElementById('refresh-devices').addEventListener('click', refreshDevices);
navigator.mediaDevices?.addEventListener?.('devicechange', refreshDevices);

outputSelect.addEventListener('change', async () => {
  selectedOutputDeviceId = outputSelect.value;
  const audioEl = document.getElementById('_sink_tester');
  if (audioEl?.setSinkId) {
    try {
      await audioEl.setSinkId(selectedOutputDeviceId || '');
      btStatus.textContent = selectedOutputDeviceId ? '✓ Output switched.' : 'Using default output.';
      btStatus.className = 'connected';
    } catch (e) {
      btStatus.textContent = `Could not switch output: ${e.message}`;
      btStatus.className = '';
    }
  }
});

/*
 * FIX: Transformers.js does not implement a `source-separation` pipeline.
 * The previous code asked Transformers.js for that unsupported task, which
 * produced the exact error shown in the screenshot before any inference ran.
 *
 * The app is now browser-safe: it no longer calls an unsupported pipeline.
 * Without a real stem-separation backend, we keep the uploaded track intact
 * and expose a clearly-labelled fallback mixer rather than pretending that
 * Demucs separated the track.
 */
async function separateStems(audioBuffer) {
  progressWrap.style.display = 'block';
  progressBar.classList.remove('error');
  progressBar.style.width = '20%';
  progressPct.textContent = '20%';
  stemStatus.className = '';
  stemStatus.textContent = 'Preparing audio for mixer…';

  await new Promise(requestAnimationFrame);
  sourceAudioBuffer = audioBuffer;
  vocalBuffer = audioBuffer;
  instBuffer = audioBuffer;

  progressBar.style.width = '100%';
  progressPct.textContent = '100%';
  stemStatus.className = 'status-success';
  stemStatus.textContent = '✓ Audio ready. Browser-only stem separation is not enabled; using the original track as fallback.';
  mixer.style.display = 'block';
  playBtn.disabled = false;
  stopBtn.disabled = false;
}

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file-input');
const fileNameEl = document.getElementById('file-name');

document.getElementById('browse-link').addEventListener('click', e => { e.stopPropagation(); fileInput.click(); });
dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) processFile(file);
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) processFile(fileInput.files[0]); });

async function processFile(file) {
  try {
    stopPlayback();
    pauseOffset = 0;
    fileNameEl.textContent = '📄 ' + file.name;
    fileNameEl.style.display = 'block';
    canvas.style.display = 'block';
    resizeCanvas();

    const ac = getAudioCtx();
    if (ac.state === 'suspended') await ac.resume();
    const arrayBuffer = await file.arrayBuffer();
    const audioBuffer = await ac.decodeAudioData(arrayBuffer.slice(0));
    sourceAudioBuffer = audioBuffer;
    drawWaveform();
    await separateStems(audioBuffer);
  } catch (err) {
    console.error('Audio loading error:', err);
    progressWrap.style.display = 'block';
    progressBar.classList.add('error');
    progressBar.style.width = '100%';
    progressPct.textContent = 'Error';
    stemStatus.className = 'status-error';
    stemStatus.textContent = `⚠ Could not load audio: ${err.message || err}`;
    mixer.style.display = 'none';
  }
}

function connectStem(buffer, gainNode) {
  const ac = getAudioCtx();
  const src = ac.createBufferSource();
  src.buffer = buffer;
  src.connect(gainNode);
  gainNode.connect(analyser);
  return src;
}

function stopPlayback() {
  if (vocalSource) { try { vocalSource.stop(); } catch (_) {} vocalSource = null; }
  if (instSource) { try { instSource.stop(); } catch (_) {} instSource = null; }
  isPlaying = false;
  playBtn.textContent = '▶ Play';
  cancelAnimationFrame(animFrame);
}

playBtn.addEventListener('click', async () => {
  const ac = getAudioCtx();
  if (ac.state === 'suspended') await ac.resume();
  if (!vocalBuffer && !instBuffer) return;
  if (isPlaying) {
    pauseOffset += ac.currentTime - startTime;
    stopPlayback();
    return;
  }
  stopPlayback();
  vocalGain = vocalGain || ac.createGain();
  instGain = instGain || ac.createGain();
  vocalGain.gain.value = Number(document.getElementById('vocals-vol').value) / 100;
  instGain.gain.value = Number(document.getElementById('inst-vol').value) / 100;

  if (vocalBuffer) {
    vocalSource = connectStem(vocalBuffer, vocalGain);
    vocalSource.detune.value = Number(document.getElementById('pitch').value) * 100;
    vocalSource.playbackRate.value = Number(document.getElementById('tempo').value);
    vocalSource.start(0, Math.min(pauseOffset, Math.max(0, vocalBuffer.duration - 0.01)));
    vocalSource.onended = () => { if (isPlaying) stopPlayback(); };
  }
  if (instBuffer && instBuffer !== vocalBuffer) {
    instSource = connectStem(instBuffer, instGain);
    instSource.detune.value = Number(document.getElementById('pitch').value) * 100;
    instSource.playbackRate.value = Number(document.getElementById('tempo').value);
    instSource.start(0, Math.min(pauseOffset, Math.max(0, instBuffer.duration - 0.01)));
  }
  startTime = ac.currentTime;
  isPlaying = true;
  playBtn.textContent = '⏸ Pause';
  drawWaveform();
});

stopBtn.addEventListener('click', () => { pauseOffset = 0; stopPlayback(); });

function linkVolume(sliderId, valId, gainRef) {
  const slider = document.getElementById(sliderId);
  const valEl = document.getElementById(valId);
  slider.addEventListener('input', () => {
    valEl.textContent = slider.value;
    const gain = gainRef();
    if (gain) gain.gain.value = Number(slider.value) / 100;
  });
}
linkVolume('vocals-vol', 'vocals-vol-val', () => vocalGain);
linkVolume('inst-vol', 'inst-vol-val', () => instGain);

document.getElementById('pitch').addEventListener('input', function () {
  document.getElementById('pitch-val').textContent = this.value + ' st';
  if (vocalSource) vocalSource.detune.value = Number(this.value) * 100;
  if (instSource) instSource.detune.value = Number(this.value) * 100;
});

document.getElementById('tempo').addEventListener('input', function () {
  const v = Number(this.value).toFixed(2);
  document.getElementById('tempo-val').textContent = v + '×';
  if (vocalSource) vocalSource.playbackRate.value = Number(v);
  if (instSource) instSource.playbackRate.value = Number(v);
});

document.getElementById('lyrics-area').addEventListener('input', function () {
  const display = document.getElementById('lyrics-display');
  display.textContent = this.value;
  display.style.display = this.value.trim() ? 'block' : 'none';
});

window.addEventListener('resize', resizeCanvas);
refreshDevices();
</script>
<audio id="_sink_tester" style="display:none"></audio>
</body>
</html>
