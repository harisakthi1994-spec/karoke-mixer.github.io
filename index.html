<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karaoke Mixer</title>
<style>
  :root{--bg:#1a1a2e;--surface:#16213e;--surface2:#0f3460;--accent:#667eea;--accent2:#c05fa0;--text:#fff;--muted:#a0aec0;--border:rgba(102,126,234,.3);--green:#3ecf8e;--red:#e05252}
  *{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:24px 16px}
  h1{text-align:center;font-size:1.7rem;margin-bottom:28px;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;max-width:680px;margin-left:auto;margin-right:auto}.card h2{font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:14px}
  #dropzone{border:2px dashed var(--border);border-radius:10px;padding:32px;text-align:center;cursor:pointer}#dropzone p{color:var(--muted);font-size:.9rem}#dropzone span{color:var(--accent);text-decoration:underline;cursor:pointer}.drop-icon{font-size:2.2rem;margin-bottom:8px}#file-input{display:none}#file-name{margin-top:10px;color:var(--green);display:none}
  #waveform-wrap{position:relative;margin-top:14px}#waveform{width:100%;height:120px;border-radius:8px;background:var(--surface2);display:none}#waveform-time{position:absolute;top:6px;right:10px;color:var(--muted);font-size:.75rem}
  #stem-progress-wrap{margin-top:14px;display:none}#stem-progress-label{font-size:.82rem;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between}#stem-progress-bar-outer{background:var(--surface2);border-radius:999px;height:8px;overflow:hidden}#stem-progress-bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .3s}.status-success{color:var(--green)!important}.status-error{color:#ff9a9a!important}
  .select-row{display:flex;gap:10px;align-items:center}.select-row label{font-size:.85rem;color:var(--muted)}select{flex:1;background:var(--surface2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:8px 12px}button{cursor:pointer}.icon-btn{background:var(--surface2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 12px;font-size:1rem}.icon-btn:hover{border-color:var(--accent)}#bt-status{font-size:.78rem;color:var(--muted);margin-top:6px}
  #mixer{display:none}.stem-row{margin-bottom:18px}.stem-label{font-weight:600}.stem-label.vocals{color:var(--accent2)}.stem-label.instrumental{color:var(--accent)}.stem-controls{display:flex;align-items:center;gap:12px;margin-top:8px}input[type=range]{appearance:none;flex:1;height:5px;border-radius:999px;background:var(--surface2)}input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent)}.vol-val{width:32px;text-align:right;color:var(--muted);font-size:.8rem}.divider{border:0;border-top:1px solid var(--border);margin:4px 0 14px}.param-row{display:flex;gap:18px;flex-wrap:wrap}.param-item{flex:1;min-width:140px}.param-item label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}.param-val{font-size:.78rem}.playback-row{display:flex;gap:10px}.play-btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:999px;padding:10px 28px;font-weight:600}.play-btn:disabled{opacity:.35;cursor:not-allowed}
  #lyrics-area{width:100%;height:130px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:12px;resize:vertical;font-family:inherit}#lyrics-display{background:var(--surface2);border-radius:8px;padding:14px;margin-top:10px;display:none;line-height:1.7}
</style>
</head>
<body>
<h1>🎤 Karaoke Mixer</h1>
<div class="card"><h2>Audio Source</h2><div id="dropzone"><div class="drop-icon">🎵</div><p>Drop audio file here or <span id="browse-link">browse</span></p><p style="margin-top:4px;font-size:.78rem">MP3, WAV, OGG, FLAC supported</p></div><input id="file-input" type="file" accept="audio/*"><div id="file-name"></div><div id="waveform-wrap"><canvas id="waveform"></canvas><span id="waveform-time"></span></div><div id="stem-progress-wrap"><div id="stem-progress-label"><span>Preparing audio…</span><span id="stem-pct">0%</span></div><div id="stem-progress-bar-outer"><div id="stem-progress-bar"></div></div><div id="stem-status">Ready.</div></div></div>
<div class="card"><h2>Audio Output Device</h2><div class="select-row"><label>Device</label><select id="output-device"><option value="">Default</option></select><button class="icon-btn" id="refresh-devices">⟳</button></div><div id="bt-status"></div></div>
<div class="card" id="mixer"><h2>Stem Mixer</h2><div class="stem-row"><div class="stem-label vocals">🎙 Vocals</div><div class="stem-controls"><input type="range" id="vocals-vol" min="0" max="100" value="100"><span class="vol-val" id="vocals-vol-val">100</span></div></div><div class="stem-row"><div class="stem-label instrumental">🎸 Instrumental</div><div class="stem-controls"><input type="range" id="inst-vol" min="0" max="100" value="100"><span class="vol-val" id="inst-vol-val">100</span></div></div><hr class="divider"><div class="param-row"><div class="param-item"><label>Pitch <span class="param-val" id="pitch-val">0 st</span></label><input type="range" id="pitch" min="-12" max="12" value="0"></div><div class="param-item"><label>Tempo <span class="param-val" id="tempo-val">1.0×</span></label><input type="range" id="tempo" min=".5" max="2" value="1" step=".05"></div></div><hr class="divider"><div class="playback-row"><button class="play-btn" id="play-btn" disabled>▶ Play</button><button class="icon-btn" id="stop-btn" disabled>■ Stop</button></div></div>
<div class="card"><h2>Lyrics</h2><textarea id="lyrics-area" placeholder="Paste or type lyrics here…"></textarea><div id="lyrics-display"></div></div>
<script>
let audioCtx=null,analyser=null,animFrame=null,sourceAudioBuffer=null,vocalBuffer=null,instBuffer=null,vocalSource=null,instSource=null,vocalGain=null,instGain=null,isPlaying=false,startTime=0,pauseOffset=0;
const canvas=document.getElementById('waveform'),ctx2d=canvas.getContext('2d'),waveTime=document.getElementById('waveform-time');
const outputSelect=document.getElementById('output-device'),btStatus=document.getElementById('bt-status'),progressWrap=document.getElementById('stem-progress-wrap'),progressBar=document.getElementById('stem-progress-bar'),progressPct=document.getElementById('stem-pct'),stemStatus=document.getElementById('stem-status'),mixer=document.getElementById('mixer'),playBtn=document.getElementById('play-btn'),stopBtn=document.getElementById('stop-btn');
function getAudioCtx(){if(!audioCtx){audioCtx=new (window.AudioContext||window.webkitAudioContext)();analyser=audioCtx.createAnalyser();analyser.fftSize=2048;analyser.connect(audioCtx.destination)}return audioCtx}
function resizeCanvas(){canvas.width=canvas.parentElement.clientWidth||640;canvas.height=120}function formatTime(s){let m=Math.floor(s/60),sec=Math.floor(s%60);return `${m}:${String(sec).padStart(2,'0')}`}
function drawWaveform(){if(!analyser)return;cancelAnimationFrame(animFrame);const render=()=>{animFrame=requestAnimationFrame(render);let W=canvas.width||640,H=canvas.height||120,d=new Uint8Array(analyser.frequencyBinCount);analyser.getByteFrequencyData(d);ctx2d.clearRect(0,0,W,H);let bw=W/d.length*2.5;for(let i=0;i<d.length;i++){let h=d[i]/255*H,t=i/d.length,r=Math.round(76+148*t),g=Math.round(110-28*t),b=Math.round(245-163*t);ctx2d.fillStyle=`rgb(${r},${g},${b})`;ctx2d.fillRect(i*bw,H-h,Math.max(1,bw-1),h)}if(isPlaying&&audioCtx)waveTime.textContent=formatTime(audioCtx.currentTime-startTime+pauseOffset)};render()}
async function refreshDevices(){try{if(navigator.mediaDevices?.getUserMedia)await navigator.mediaDevices.getUserMedia({audio:true}).catch(()=>{});let ds=await navigator.mediaDevices.enumerateDevices(),outs=ds.filter(d=>d.kind==='audiooutput');outputSelect.innerHTML='<option value="">Default</option>';outs.forEach(d=>{let o=document.createElement('option');o.value=d.deviceId;o.textContent='🔊 '+(d.label||`Output ${d.deviceId.slice(0,6)}`);outputSelect.appendChild(o)});btStatus.textContent=outs.length>1?`${outs.length} output(s) found.`:'No additional output devices found.'}catch(e){btStatus.textContent='Device enumeration not supported in this browser.'}}

/*
 * The old implementation called Transformers.js with the unsupported task
 * `source-separation` and `Xenova/demucs`, which produced the screenshot error.
 * There is no valid browser-only replacement by simply changing that string.
 * Instead, this frontend asks an optional real separation API for Demucs stems.
 * If none is configured, it falls back to the original track without throwing.
 */
async function separateStems(audioBuffer,file){
  progressWrap.style.display='block';progressBar.style.width='12%';progressPct.textContent='12%';stemStatus.className='';stemStatus.textContent='Checking stem separation service…';
  const endpoint=window.SEPARATION_API_URL||localStorage.getItem('SEPARATION_API_URL')||'';
  if(!endpoint){sourceAudioBuffer=audioBuffer;vocalBuffer=audioBuffer;instBuffer=audioBuffer;progressBar.style.width='100%';progressPct.textContent='100%';stemStatus.className='status-success';stemStatus.textContent='✓ Audio loaded. Stem separation service is not configured; using original track.';mixer.style.display='block';playBtn.disabled=false;stopBtn.disabled=false;return}
  try{
    const fd=new FormData();fd.append('file',file,file.name);
    progressBar.style.width='25%';progressPct.textContent='25%';stemStatus.textContent='Uploading audio for separation…';
    const res=await fetch(endpoint,{method:'POST',body:fd});
    if(!res.ok)throw new Error(`Separation service returned HTTP ${res.status}`);
    const data=await res.json();
    if(!data.vocals||!data.instrumental)throw new Error('Separation service response must include vocals and instrumental audio URLs');
    progressBar.style.width='60%';progressPct.textContent='60%';stemStatus.textContent='Downloading separated stems…';
    const ac=getAudioCtx();
    const [vocalsRes,instRes]=await Promise.all([fetch(data.vocals),fetch(data.instrumental)]);
    if(!vocalsRes.ok||!instRes.ok)throw new Error('Could not download separated stems');
    const [vocalsBytes,instBytes]=await Promise.all([vocalsRes.arrayBuffer(),instRes.arrayBuffer()]);
    vocalBuffer=await ac.decodeAudioData(vocalsBytes.slice(0));
    instBuffer=await ac.decodeAudioData(instBytes.slice(0));
    progressBar.style.width='100%';progressPct.textContent='100%';stemStatus.className='status-success';stemStatus.textContent='✓ Vocals and instrumental separated successfully.';mixer.style.display='block';playBtn.disabled=false;stopBtn.disabled=false;
  }catch(err){console.error('Stem separation error:',err);sourceAudioBuffer=audioBuffer;vocalBuffer=audioBuffer;instBuffer=audioBuffer;progressBar.style.width='100%';progressPct.textContent='100%';stemStatus.className='status-success';stemStatus.textContent='⚠ Stem separation unavailable. Using original track so playback remains available.';mixer.style.display='block';playBtn.disabled=false;stopBtn.disabled=false}
}

const dropzone=document.getElementById('dropzone'),fileInput=document.getElementById('file-input'),fileNameEl=document.getElementById('file-name');document.getElementById('browse-link').addEventListener('click',e=>{e.stopPropagation();fileInput.click()});dropzone.addEventListener('click',()=>fileInput.click());dropzone.addEventListener('dragover',e=>{e.preventDefault();dropzone.classList.add('drag-over')});dropzone.addEventListener('dragleave',()=>dropzone.classList.remove('drag-over'));dropzone.addEventListener('drop',e=>{e.preventDefault();dropzone.classList.remove('drag-over');if(e.dataTransfer.files[0])processFile(e.dataTransfer.files[0])});fileInput.addEventListener('change',()=>{if(fileInput.files[0])processFile(fileInput.files[0])});
async function processFile(file){try{stopPlayback();pauseOffset=0;fileNameEl.textContent='📄 '+file.name;fileNameEl.style.display='block';canvas.style.display='block';resizeCanvas();let ac=getAudioCtx();if(ac.state==='suspended')await ac.resume();let ab=await file.arrayBuffer(),buf=await ac.decodeAudioData(ab.slice(0));sourceAudioBuffer=buf;drawWaveform();await separateStems(buf,file)}catch(err){console.error('Audio loading error:',err);stemStatus.className='status-error';stemStatus.textContent='⚠ Could not load audio: '+(err.message||err);mixer.style.display='none'}}
function connectStem(buffer,gain){let ac=getAudioCtx(),src=ac.createBufferSource();src.buffer=buffer;src.connect(gain);gain.connect(analyser);return src}
function stopPlayback(){if(vocalSource){try{vocalSource.stop()}catch(_){ }vocalSource=null}if(instSource){try{instSource.stop()}catch(_){ }instSource=null}isPlaying=false;playBtn.textContent='▶ Play';cancelAnimationFrame(animFrame)}
playBtn.addEventListener('click',async()=>{let ac=getAudioCtx();if(ac.state==='suspended')await ac.resume();if(!vocalBuffer&&!instBuffer)return;if(isPlaying){pauseOffset+=ac.currentTime-startTime;stopPlayback();return}stopPlayback();vocalGain=vocalGain||ac.createGain();instGain=instGain||ac.createGain();vocalGain.gain.value=+document.getElementById('vocals-vol').value/100;instGain.gain.value=+document.getElementById('inst-vol').value/100;if(vocalBuffer){vocalSource=connectStem(vocalBuffer,vocalGain);vocalSource.detune.value=+document.getElementById('pitch').value*100;vocalSource.playbackRate.value=+document.getElementById('tempo').value;vocalSource.start(0,Math.min(pauseOffset,Math.max(0,vocalBuffer.duration-.01)));vocalSource.onended=()=>{if(isPlaying)stopPlayback()}}if(instBuffer&&instBuffer!==vocalBuffer){instSource=connectStem(instBuffer,instGain);instSource.detune.value=+document.getElementById('pitch').value*100;instSource.playbackRate.value=+document.getElementById('tempo').value;instSource.start(0,Math.min(pauseOffset,Math.max(0,instBuffer.duration-.01)))}startTime=ac.currentTime;isPlaying=true;playBtn.textContent='⏸ Pause';drawWaveform()});stopBtn.addEventListener('click',()=>{pauseOffset=0;stopPlayback()});
function linkVolume(id,valId,getGain){let s=document.getElementById(id),v=document.getElementById(valId);s.addEventListener('input',()=>{v.textContent=s.value;let g=getGain();if(g)g.gain.value=+s.value/100})}linkVolume('vocals-vol','vocals-vol-val',()=>vocalGain);linkVolume('inst-vol','inst-vol-val',()=>instGain);document.getElementById('pitch').addEventListener('input',function(){document.getElementById('pitch-val').textContent=this.value+' st';if(vocalSource)vocalSource.detune.value=+this.value*100;if(instSource)instSource.detune.value=+this.value*100});document.getElementById('tempo').addEventListener('input',function(){let v=+this.value;document.getElementById('tempo-val').textContent=v.toFixed(2)+'×';if(vocalSource)vocalSource.playbackRate.value=v;if(instSource)instSource.playbackRate.value=v});document.getElementById('lyrics-area').addEventListener('input',function(){let d=document.getElementById('lyrics-display');d.textContent=this.value;d.style.display=this.value.trim()?'block':'none'});
outputSelect.addEventListener('change',async()=>{let a=document.getElementById('_sink_tester');if(a?.setSinkId){try{await a.setSinkId(outputSelect.value||'');btStatus.textContent=outputSelect.value?'✓ Output switched.':'Using default output.'}catch(e){btStatus.textContent='Could not switch output: '+e.message}}});document.getElementById('refresh-devices').addEventListener('click',refreshDevices);navigator.mediaDevices?.addEventListener?.('devicechange',refreshDevices);window.addEventListener('resize',resizeCanvas);refreshDevices();
</script><audio id="_sink_tester" style="display:none"></audio>
</body>
</html>
